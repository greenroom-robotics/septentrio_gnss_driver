[workspace]
name = "septentrio_gnss_driver"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[package]
name        = "septentrio_gnss_driver"
version     = "1.7.0"
description = "ROSaic: C++ driver for Septentrio's GNSS and INS receivers"
license     = "BSD-3-Clause"
authors     = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.host-dependencies]
ros-kilted-ament-cmake               = "*"
ros-kilted-ament-cmake-gtest         = "*"
ros-kilted-rclcpp                    = "*"
ros-kilted-rclcpp-components         = "*"
ros-kilted-rosidl-default-generators = "*"
ros-kilted-diagnostic-msgs           = "*"
ros-kilted-diagnostic-updater        = "*"
ros-kilted-nmea-msgs                 = "*"
ros-kilted-sensor-msgs               = "*"
ros-kilted-geometry-msgs             = "*"
ros-kilted-geographic-msgs           = "*"
ros-kilted-gps-msgs                  = "*"
ros-kilted-nav-msgs                  = "*"
ros-kilted-tf2                       = "*"
ros-kilted-tf2-eigen                 = "*"
ros-kilted-tf2-geometry-msgs         = "*"
ros-kilted-tf2-ros                   = "*"
ros-kilted-std-msgs                  = "*"
libboost-devel                       = "*"
libpcap                              = "*"
geographiclib-cpp                    = "*"

[package.run-dependencies]
ros-kilted-rclcpp                  = "*"
ros-kilted-rclcpp-components       = "*"
ros-kilted-rosidl-default-runtime  = "*"
ros-kilted-diagnostic-msgs         = "*"
ros-kilted-diagnostic-updater      = "*"
ros-kilted-nmea-msgs               = "*"
ros-kilted-sensor-msgs             = "*"
ros-kilted-geometry-msgs           = "*"
ros-kilted-geographic-msgs         = "*"
ros-kilted-gps-msgs                = "*"
ros-kilted-nav-msgs                = "*"
ros-kilted-tf2                     = "*"
ros-kilted-tf2-eigen               = "*"
ros-kilted-tf2-geometry-msgs       = "*"
ros-kilted-tf2-ros                 = "*"
libboost                           = "*"
libpcap                            = "*"
geographiclib-cpp                  = "*"

[dependencies.septentrio_gnss_driver]
path   = "."
extras = ["test"]

[package.build.backend]
name    = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode         = "pixi-native"
build-type   = "ament_idl"
distro       = "kilted"
build-number = 1

[package.extra-dependencies.test]
ros-dev-tools-meta                   = "*"
ros-kilted-rosidl-default-generators = "*"
ros-kilted-ament-cmake-gtest         = "*"
ros-kilted-ament-lint-auto           = "*"
libboost-devel                       = "*"
libpcap                              = "*"
geographiclib-cpp                    = "*"

[tasks]
build = "colcon build --packages-select septentrio_gnss_driver --symlink-install"

# ament_target_dependencies links the interface packages' *__rosidl_generator_py
# libs, which declare no libpython and carry undefined CPython symbols, so the
# gtest binaries need libpython loaded to start at all.
[tasks.colcon-test]
cmd        = "bash -c 'colcon test --packages-select septentrio_gnss_driver --retest-until-pass 3 --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]
env        = { LD_PRELOAD = "$CONDA_PREFIX/lib/libpython3.so" }

[tasks.test]
cmd        = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
